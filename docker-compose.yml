services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vaultfoundry
    ports:
      - "5432:5432"
    volumes:
      - vaultfoundry-postgres:/var/lib/postgresql/data

volumes:
  vaultfoundry-postgres:
