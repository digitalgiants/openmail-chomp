services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides DATABASE_URL from .env — inside the compose network the app
      # reaches Postgres by service name, never localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-vaultfoundry}
    ports:
      - "127.0.0.1:6567:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/uploads:/app/data/uploads:Z
    healthcheck:
      # 127.0.0.1, not localhost — Next's standalone server (HOSTNAME=0.0.0.0)
      # binds IPv4 only, but "localhost" can resolve to ::1 first inside an
      # Alpine/musl container, which nothing is listening on. That gave a
      # false "connection refused" here even though the app was up and
      # reachable fine from the host via the published port.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # One-off schema/migration runner. The `app` image is Next's pruned
  # `output: standalone` build and never has drizzle-kit or devDependencies
  # in it — this builds from the earlier `builder` stage instead, which has
  # the full toolchain. Meant to be invoked explicitly, e.g.:
  #   podman-compose run --rm migrate npm run db:push
  #   podman-compose run --rm migrate npm run db:migrate
  # No `profiles:` gate here on purpose — podman-compose has inconsistent
  # support for profiles (has been seen to hide the service from `run` too,
  # not just `up`). The default command (db:push) is idempotent and
  # restart is "no", so it's harmless if `up` also starts this once and
  # lets it exit.
  migrate:
    build:
      context: .
      target: builder
    restart: "no"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-vaultfoundry}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["npm", "run"]
    command: ["db:push"]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vaultfoundry}
      # initdb refuses to use a bind-mount point directly as PGDATA if it
      # contains anything at all (even a dotfile like .gitkeep) — point it
      # at a subdirectory of the mount instead, per Postgres's own advice.
      PGDATA: /var/lib/postgresql/data/pgdata
    # Intentionally no `ports:` — Postgres is reachable only from other
    # containers on this compose network (i.e. the app), never from the host.
    volumes:
      - ./data/postgres:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
