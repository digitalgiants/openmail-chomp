services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides DATABASE_URL from .env — inside the compose network the app
      # reaches Postgres by service name, never localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-vaultfoundry}
    ports:
      - "127.0.0.1:6567:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/uploads:/app/data/uploads:Z
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vaultfoundry}
      # initdb refuses to use a bind-mount point directly as PGDATA if it
      # contains anything at all (even a dotfile like .gitkeep) — point it
      # at a subdirectory of the mount instead, per Postgres's own advice.
      PGDATA: /var/lib/postgresql/data/pgdata
    # Intentionally no `ports:` — Postgres is reachable only from other
    # containers on this compose network (i.e. the app), never from the host.
    volumes:
      - ./data/postgres:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
